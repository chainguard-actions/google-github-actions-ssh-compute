on:
  push:
    branches:
      - 'main'

name: 'Connect to GCP instance via ssh and execute a command'
env:
  ZONE: 'us-central1-a'

jobs:
  ssh:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744' # v3

      # Configure Workload Identity Federation and generate an access token.
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER_NAME }}'
          service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'

      - name: 'SSH to GCP instance'
        id: 'ssh'
        uses: 'google-github-actions/ssh-compute@a748312ad1aca8faf0a14c468e25b04d80bfb018' # v1
        with:
          instance_name: 'instance-name'
          zone: '${{ env.ZONE }}'
          ssh_private_key: '${{ secrets.VM_PRIVATE_KEY }}'
          command: 'echo Hello world'

      - name: 'Show Output'
        env:
          STDOUT: ${{ steps.ssh.outputs.stdout }}
          STDERR: ${{ steps.ssh.outputs.stderr }}
        run: |-
          echo "$STDOUT"
          echo "$STDERR"
