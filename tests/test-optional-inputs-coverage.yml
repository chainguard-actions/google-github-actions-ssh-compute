name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ssh_keys_dir
        run: mkdir -p /tmp/ssh-keys-test

      - name: Run action with all optional inputs specified
        id: action
        uses: .
        with:
          instance_name: 'my-instance'
          zone: 'us-central1-a'
          ssh_private_key: 'fake-key'
          command: 'echo hello'
          user: 'testuser'
          ssh_keys_dir: '/tmp/ssh-keys-test'
          container: 'my-container'
          ssh_args: '-vvv'
          project_id: 'my-gcp-project'
          flags: '--tunnel-through-iap'
          gcloud_version: 'latest'
        continue-on-error: true

      - name: Assert action failed as expected (no real GCP instance available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without real GCP credentials/instance, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed as expected (all optional inputs were accepted)"
