name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ssh_keys_dir
        run: mkdir -p /tmp/test-ssh-keys

      - id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: test-instance
          zone: us-central1-a
          user: testuser
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcOCMNMHxiGMoOFOFBnF
            INVALID_KEY_FOR_TESTING_PURPOSES_ONLY
            -----END RSA PRIVATE KEY-----
          ssh_keys_dir: /tmp/test-ssh-keys
          container: my-container
          ssh_args: '-o StrictHostKeyChecking=no'
          project_id: my-test-project
          flags: '--tunnel-through-iap'
          gcloud_version: latest
          command: echo hello

      - name: Assert action ran with optional inputs (fails gracefully on invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real GCP instance)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
