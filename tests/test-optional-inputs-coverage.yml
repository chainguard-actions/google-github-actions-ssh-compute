name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create temp ssh keys dir
        run: mkdir -p /tmp/test-ssh-keys

      - id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: test-instance
          zone: us-central1-a
          user: testuser
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAcOCMqBMNFMaFBMBGMaM
            INVALID_KEY_FOR_TESTING_PURPOSES_ONLY
            -----END RSA PRIVATE KEY-----
          ssh_keys_dir: /tmp/test-ssh-keys
          container: my-container
          ssh_args: '-o StrictHostKeyChecking=no'
          project_id: my-test-project
          flags: '--ssh-key-expiration=2099-01-01T00:00:00.000Z'
          gcloud_version: latest
          command: echo hello

      - name: Assert action ran (with or without error due to invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should either fail (invalid key/instance) or succeed
          # Either way, the inputs were passed and covered
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action executed with optional inputs"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
