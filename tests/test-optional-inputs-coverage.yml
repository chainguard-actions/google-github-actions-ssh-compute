name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with all optional inputs (expect failure due to missing credentials)
        id: action
        uses: .
        with:
          instance_name: test-instance
          zone: us-central1-a
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          command: echo hello
          user: test-user
          ssh_keys_dir: /tmp/ssh-keys-test
          container: my-container
          ssh_args: '-vvv'
          project_id: my-test-project
          flags: '--ssh-key-expiration=2099-01-01T00:00:00.000Z'
          gcloud_version: latest
        continue-on-error: true

      - name: Assert action failed (expected without real GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without real GCP credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without real GCP credentials"
