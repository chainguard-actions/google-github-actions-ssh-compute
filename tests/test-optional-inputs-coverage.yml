name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create ssh keys dir
        run: mkdir -p /tmp/test-ssh-keys

      - id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: test-instance
          zone: us-central1-a
          user: testuser
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACBY2GgFMRjFkMTM4NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MAAAAJB0eXN0
            dHlzdAAAAAtlZDI1NTE5AAAAIFjYaAUxGMWQzMzg1Njc4OTBhYmNkZWYxMjM0NTY3ODk
            wAAAAQFjYaAUxGMWQzMzg1Njc4OTBhYmNkZWYxMjM0NTY3ODkwWNhoBTEYxZDM4NTY3
            ODkwYWJjZGVmMTIzNDU2Nzg5MAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtestkey
            -----END OPENSSH PRIVATE KEY-----
          ssh_keys_dir: /tmp/test-ssh-keys
          container: my-container
          ssh_args: "-o StrictHostKeyChecking=no"
          project_id: my-test-project
          flags: "--tunnel-through-iap"
          gcloud_version: "latest"
          command: echo hello

      - name: Assert action ran (optional inputs accepted, fails gracefully without real GCP)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real GCP instance available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
