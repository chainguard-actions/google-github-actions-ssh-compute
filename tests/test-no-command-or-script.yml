name: Test missing command and script inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without command or script (expect failure)
        id: action
        uses: .
        with:
          instance_name: test-instance
          zone: us-central1-a
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
        continue-on-error: true

      - name: Assert action failed due to missing command and script
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when neither command nor script is provided, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when neither command nor script was provided"
