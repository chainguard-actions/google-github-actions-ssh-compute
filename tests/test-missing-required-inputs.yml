name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without required inputs and expect failure
        id: action
        uses: .
        with:
          instance_name: ''
          zone: ''
          ssh_private_key: ''
          command: 'echo hello'
        continue-on-error: true

      - name: Assert action failed due to missing required inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required inputs are missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing required inputs"
