name: Test missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with missing instance_name (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          zone: us-central1-a
          ssh_private_key: fake-key
          command: echo hello

      - name: Assert action failed due to missing required input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when instance_name is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when instance_name was missing"
