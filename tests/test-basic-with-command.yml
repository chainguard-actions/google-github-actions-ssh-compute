name: Test basic usage with command input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: test-instance
          zone: us-central1-a
          user: testuser
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAQOGMCFMEOSMaGSMoAoL
            -----END RSA PRIVATE KEY-----
          command: echo hello

      - name: Assert action ran (failed at GCP connection, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there are no real GCP credentials,
          # but it should NOT fail due to input validation errors.
          # We verify it attempted to run (outcome is failure due to GCP, not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (failed at GCP connection as expected without real credentials)"
