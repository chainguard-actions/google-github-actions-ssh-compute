name: Test action fails without GCP credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate fake SSH key
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: fake-instance
          zone: us-central1-a
          ssh_private_key: ${{ env.SSH_PRIVATE_KEY }}
          command: echo hello

      - name: Assert action failed without GCP credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without valid GCP credentials"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
