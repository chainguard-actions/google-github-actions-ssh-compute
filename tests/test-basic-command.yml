name: Test basic SSH with command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: test-instance
          zone: us-central1-a
          user: testuser
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAZnFMBMjEMkFCFBMFBMF
            -----END RSA PRIVATE KEY-----
          ssh_keys_dir: /tmp/ssh-keys-test
          ssh_args: '-o StrictHostKeyChecking=no'
          command: echo hello
          project_id: my-test-project
          flags: '--tunnel-through-iap'
      - name: Assert action ran (may fail due to no real GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
