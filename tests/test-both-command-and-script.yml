name: Test both command and script provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test script file
        run: |
          echo '#!/bin/bash' > /tmp/test-script.sh
          echo 'echo hello from script' >> /tmp/test-script.sh
          chmod +x /tmp/test-script.sh

      - id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: my-instance
          zone: us-central1-a
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            fake-key-data
            -----END OPENSSH PRIVATE KEY-----
          command: echo hello
          script: /tmp/test-script.sh

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when both command and script are provided"
            exit 1
          fi
          echo "PASS: action correctly failed when both command and script are provided"
