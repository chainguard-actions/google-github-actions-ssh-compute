name: Test command and script both specified is invalid
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with both command and script (invalid combination)
        id: action
        uses: .
        with:
          instance_name: 'my-instance'
          zone: 'us-central1-a'
          ssh_private_key: 'fake-key'
          command: 'echo hello'
          script: '/tmp/myscript.sh'
        continue-on-error: true

      - name: Assert action failed due to invalid input combination
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both command and script are specified, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when both command and script were specified"
