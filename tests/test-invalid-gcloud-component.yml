name: Test invalid gcloud_component input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid gcloud_component (expect failure)
        id: action
        uses: .
        with:
          instance_name: test-instance
          zone: us-central1-a
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          command: echo hello
          gcloud_component: gamma
        continue-on-error: true

      - name: Assert action failed due to invalid gcloud_component
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid gcloud_component='gamma', but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid gcloud_component value"
