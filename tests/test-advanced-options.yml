name: Test advanced SSH options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy script file
        run: |
          echo '#!/bin/bash' > /tmp/test-script.sh
          echo 'echo hello from script' >> /tmp/test-script.sh
          chmod +x /tmp/test-script.sh
      - id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: my-container-instance
          zone: us-east1-b
          ssh_private_key: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFKFHiJNBYBNMTsKMDaS
            -----END RSA PRIVATE KEY-----
          container: my-container
          ssh_args: '-vvv'
          script: /tmp/test-script.sh
          flags: '--ssh-key-expiration=2099-01-01T00:00:00.000Z'
          gcloud_version: latest
          gcloud_component: beta
      - name: Assert action ran (may fail due to no real GCP)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
