name: Test invalid credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: fake-instance
          zone: us-central1-a
          user: testuser
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAA
            -----END OPENSSH PRIVATE KEY-----
          command: echo hello
          project_id: fake-project-12345

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials but it succeeded"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
