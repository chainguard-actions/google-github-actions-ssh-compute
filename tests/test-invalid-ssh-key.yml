name: Test invalid SSH private key fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: my-instance
          zone: us-central1-a
          ssh_private_key: this-is-not-a-valid-ssh-private-key
          command: echo hello

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid SSH private key"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid SSH private key"
