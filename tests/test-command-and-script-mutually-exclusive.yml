name: Test command and script are mutually exclusive
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy script file
        run: |
          echo '#!/bin/bash' > /tmp/test-script.sh
          echo 'echo hello' >> /tmp/test-script.sh
          chmod +x /tmp/test-script.sh

      - name: Run action with both command and script (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          instance_name: fake-instance
          zone: us-central1-a
          ssh_private_key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2VrZXlmYWtla2V5
            -----END OPENSSH PRIVATE KEY-----
          command: echo hello
          script: /tmp/test-script.sh

      - name: Assert action failed due to mutual exclusion
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both command and script are provided, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when both command and script were provided"
